name: CI

# The tax figures are the whole product, so nothing merges without the full
# suite passing — 136 tests covering the calculation engine plus the built
# site's internal links, canonicals and titles.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install from lockfile
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build and test
        run: npm run verify

      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
